  a.card:nth-child(1){animation-delay:.22s}
  a.card:nth-child(2){animation-delay:.3s}
  a.card:nth-child(3){animation-delay:.38s}
  a.card:active{transform:scale(.985)}
  @media (hover:hover){a.card:hover{transform:translateY(-3px);background:rgba(255,255,255,.09);border-color:rgba(201,162,92,.5)}}

  .card .top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .card .name{font-family:"KaiTi","STKaiti",serif;font-size:clamp(18px,4.8vw,23px);letter-spacing:.08em}
  .card .badge{margin-left:auto;font-size:11px;letter-spacing:.1em;color:#8d8270}
  .card .desc{margin-top:6px;font-size:clamp(12px,3.3vw,13.5px);color:#a99d87;line-height:1.7}

  .card.main{
    border-color:rgba(184,69,47,.55);background:rgba(156,50,38,.14);

  }
  .card.main .name{font-size:clamp(21px,5.6vw,27px)}
  .card.main .go{

    width:100%;padding:14px;border-radius:12px;
    background:linear-gradient(150deg,#b8452f,#9c3226);
    color:#fdf4e4;font-size:15px;letter-spacing:.18em;text-indent:.18em;
    box-shadow:0 10px 26px rgba(156,50,38,.36);
  }

  .dl-group{margin-top:clamp(22px,4vw,32px);width:100%;max-width:520px;min-width:0}
  .dl-title{
    font-size:12px;letter-spacing:.3em;text-indent:.3em;color:#7d7361;
    display:flex;align-items:center;gap:12px;margin-bottom:12px;
  }
  .dl-title::before,.dl-title::after{content:"";flex:1;height:1px;background:rgba(201,162,92,.18)}

  .dl{
    display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit;
    padding:13px 16px;border-radius:12px;
    background:rgba(255,255,255,.03);border:1px solid rgba(201,162,92,.16);
    transition:background .3s,border-color .3s;
  }
  .dl + .dl{margin-top:9px}
  .dl:active{background:rgba(255,255,255,.08)}
  @media (hover:hover){.dl:hover{background:rgba(255,255,255,.08);border-color:rgba(201,162,92,.36)}}
  .dl .n{font-family:"KaiTi","STKaiti",serif;font-size:15px;letter-spacing:.06em}
  .dl .s{margin-left:auto;font-size:11.5px;color:#7d7361;font-variant-numeric:tabular-nums;white-space:nowrap}
  .dl .ico{color:#c9a25c;font-size:15px}

  .tips{width:100%;max-width:520px;min-width:0;margin-top:clamp(24px,5vw,36px);
    font-size:12.5px;line-height:2;color:#7d7361;
    animation:up .8s .5s cubic-bezier(.16,1,.3,1) both}
  .tips b{color:#c9a25c;font-weight:400}
  .tips .li{margin-left:16px;margin-top:4px}
  .foot{margin-top:clamp(26px,5vw,40px);font-size:11px;letter-spacing:.26em;color:#5c5446;text-align:center}
